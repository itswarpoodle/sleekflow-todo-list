name: sleekflow-todo

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sleekflow_todo
      POSTGRES_USER: sleekflow
      POSTGRES_PASSWORD: sleekflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sleekflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleekflow -d sleekflow_todo"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sleekflow_todo
      DATABASE_USERNAME: sleekflow
      DATABASE_PASSWORD: sleekflow
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sleekflow-postgres-data:
